[package]
name = "puzzella-game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
puzzella-core.workspace = true
puzzella-puzzle.workspace = true
bevy.workspace = true
bevy_egui.workspace = true
serde.workspace = true
serde_json = "1"
image.workspace = true
rand.workspace = true
sha2 = "0.10"
directories = "6"
tempfile = "3"
crossbeam.workspace = true
instant.workspace = true
rstar = { workspace = true, optional = true }
gns = { package = "game-networking-sockets", version = "=0.3.0", optional = true }
postcard = { version = "1.1", features = ["alloc"], default-features = false }
pakery-spake2 = "=0.6.0"
pakery-core = "=0.6.0"
pakery-crypto = { version = "=0.6.0", default-features = false, features = ["std", "p256", "spake2"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
rand_core = "0.10"
zeroize = "1.9"
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
hkdf = "=0.13.0"
sha2_channel = { package = "sha2", version = "=0.11.0" }

[target.'cfg(windows)'.dependencies]
wgpu-hal.workspace = true

[features]
default = []
gns = ["dep:gns"]
cpu-geometry-reference = ["puzzella-puzzle/cpu-geometry-reference"]
cpu-picking-debug = ["puzzella-puzzle/cpu-picking-debug", "dep:rstar"]

[dev-dependencies]
rstar.workspace = true
puzzella-puzzle = { workspace = true, features = ["cpu-picking-debug"] }
