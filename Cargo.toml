[package]
name = "puzzella"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.16.1", default-features = false, features = ["bevy_winit", "bevy_render", "bevy_core_pipeline", "bevy_sprite", "bevy_asset", "bevy_ui", "bevy_text", "bevy_picking", "png", "x11"] }
# bevy_renet = "1.0.0" # 一時的に無効化
# renet = "1.0.0" # 一時的に無効化
bevy_egui = "0.35"
serde = { version = "1.0", features = ["derive"] }
image = "0.25"
rand = "0.8"
uuid = { version = "1.0", features = ["v4"] }
bincode = "1.3"
rfd = { version = "0.11", default-features = false, features = ["xdg-portal"] }
puzzle-paths = "0.0.9"
lyon = "1.0"
lyon_tessellation = "1.0"
svgtypes = "0.15"
