[package]
name = "puzzella"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.14.2", default-features = false, features = ["bevy_winit", "bevy_render", "bevy_core_pipeline", "bevy_sprite", "bevy_asset", "bevy_ui", "bevy_text", "png", "x11"] }
bevy_renet = "0.0.12"
renet = "0.0.15"
bevy_egui = "0.29"
serde = { version = "1.0", features = ["derive"] }
image = "0.25"
rand = "0.8"
uuid = { version = "1.0", features = ["v4"] }
bincode = "1.3"
