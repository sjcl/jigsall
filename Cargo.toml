[workspace]
members = [".", "core", "game", "puzzle", "ui"]
default-members = [".", "core", "game", "puzzle", "ui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false

[workspace.dependencies]
puzzella-core = { path = "core" }
puzzella-puzzle = { path = "puzzle" }
puzzella-game = { path = "game" }
puzzella-ui = { path = "ui" }
bevy = { version = "0.19.1", default-features = false, features = ["2d", "mouse", "keyboard", "bevy_state", "serialize", "png", "jpeg", "webp", "bmp", "x11", "trace"] }
bevy_asset = "0.19.1"
bevy_ecs = "0.19.1"
bevy_log = "0.19.1"
bevy_math = { version = "0.19.1", features = ["serialize"] }
bevy_mesh = "0.19.1"
bevy_egui = "0.42"
serde = { version = "1.0", features = ["derive"] }
image = "0.25"
rand = "0.10"
rand_chacha = "0.10"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
rayon = "1.11"
lyon = "1.0"
lyon_tessellation = "1.0"
crossbeam = "0.8"
instant = "0.1"
rstar = "0.12"

# wgpu-hal 29.0.4 and gpu-allocator 0.28 use incompatible Windows COM types.
# Keep the compatible patch until upstream aligns these dependencies.
wgpu-hal = "=29.0.3"

[package]
name = "puzzella"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bevy.workspace = true
puzzella-game.workspace = true
puzzella-ui.workspace = true

[features]
default = []
gns = ["puzzella-game/gns"]
cpu-geometry-reference = ["puzzella-game/cpu-geometry-reference"]
cpu-picking-debug = ["puzzella-game/cpu-picking-debug"]
# Tracy Profilerを使用する場合（高度なプロファイリング）
tracy = ["bevy/trace_tracy"]
# Chrome Tracingを使用する場合（ブラウザでの分析）
chrome = ["bevy/trace_chrome"]

# Keep workspace rebuilds fast while improving development runtime performance.
[profile.dev]
opt-level = 1

# Fully optimize dependencies, which change less often than workspace crates.
[profile.dev.package."*"]
opt-level = 3

# Trade longer release builds for additional whole-program optimization.
[profile.release]
lto = "thin"
codegen-units = 1
