[workspace]
members = [".", "core", "game", "puzzle", "ui"]
default-members = [".", "core", "game", "puzzle", "ui"]
resolver = "2"
exclude = ["vendor/game-networking-sockets", "vendor/game-networking-sockets-sys"]

[patch.crates-io]
# Pinned 0.3.0 wrapper initialization and native ICE live TURN credentials.
game-networking-sockets = { path = "vendor/game-networking-sockets" }

game-networking-sockets-sys = { path = "vendor/game-networking-sockets-sys" }

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.99"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
jigsall-core = { path = "core" }
jigsall-puzzle = { path = "puzzle" }
jigsall-game = { path = "game" }
jigsall-ui = { path = "ui" }
# Expand Bevy's 2d bundle to avoid common_api enabling the HDR decoder.
bevy = { version = "0.19.1", default-features = false, features = [
    "default_app", "default_platform", "scene", "picking",
    "bevy_animation", "bevy_camera", "bevy_color", "bevy_gizmos", "bevy_image",
    "bevy_mesh", "bevy_shader", "bevy_material", "bevy_text", "bevy_window",
    "bevy_sprite", "bevy_render", "bevy_core_pipeline", "bevy_post_process",
    "bevy_sprite_render", "bevy_gizmos_render",
    "mouse", "keyboard", "bevy_state", "serialize", "png", "jpeg", "webp", "bmp", "x11", "trace",
] }
bevy_ecs = "0.19.1"
bevy_log = "0.19.1"
bevy_math = { version = "0.20.0", features = ["serialize"] }
bevy_egui = "0.42"
ab_glyph = "0.2"
serde = { version = "1.0", features = ["derive"] }
# Keep content-based decoding limited to the formats offered by the image picker.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
fast_image_resize = { version = "6.1", default-features = false, features = ["std", "only_u8x4"] }
rand = "0.10"
rand_chacha = "0.10"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
crossbeam = "0.8"
base64 = "0.23"
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
url = "2"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1"
zeroize = "1.9"
instant = "0.1"
winresource = "0.1.31"
winit = { version = "0.30.13", default-features = false }
windows-sys = "0.61.2"

# wgpu-hal 29.0.4 and gpu-allocator 0.28 use incompatible Windows COM types.
# Keep the compatible patch until upstream aligns these dependencies.
wgpu-hal = "=29.0.3"
ash = { version = "0.38", default-features = false, features = ["std"] }
wgpu-types = "29.0.3"
objc2-metal = { version = "0.3.2", default-features = false, features = ["MTLDevice"] }

[package]
name = "jigsall"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
bevy.workspace = true
jigsall-game.workspace = true
jigsall-ui.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[build-dependencies]
winresource.workspace = true

[features]
default = []
gns = ["jigsall-game/gns", "jigsall-ui/gns"]
rendezvous = ["gns", "jigsall-game/rendezvous", "jigsall-ui/rendezvous"]
# Tracy Profilerを使用する場合（高度なプロファイリング）
tracy = ["bevy/trace_tracy"]
# Chrome Tracingを使用する場合（ブラウザでの分析）
chrome = ["bevy/trace_chrome"]

# Keep workspace rebuilds fast while improving development runtime performance.
[profile.dev]
opt-level = 1

# Fully optimize dependencies, which change less often than workspace crates.
[profile.dev.package."*"]
opt-level = 3

# Trade longer release builds for additional whole-program optimization.
[profile.release]
lto = "thin"
codegen-units = 1
