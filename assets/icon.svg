<svg xmlns="http://www.w3.org/2000/svg" viewBox="44 44 936 936" width="1024" height="1024">
  <defs>
    <clipPath id="bigPieceClip">
      <path d="
        M 304 236
        H 424
        C 424 183 461 148 512 148
        C 563 148 600 183 600 236
        H 720
        C 758 236 788 266 788 304
        V 414
        C 835 414 868 449 868 496
        C 868 543 835 578 788 578
