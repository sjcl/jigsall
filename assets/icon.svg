      <rect x="156" y="148" width="242" height="214" fill="#4F46E5"/>
      <rect x="398" y="148" width="228" height="214" fill="#7C3AED"/>
      <rect x="626" y="148" width="242" height="214" fill="#DB2777"/>

      <rect x="156" y="362" width="242" height="210" fill="#2563EB"/>
      <rect x="398" y="362" width="228" height="210" fill="#06B6D4"/>
      <rect x="626" y="362" width="242" height="210" fill="#F97316"/>

      <rect x="156" y="572" width="242" height="216" fill="#14B8A6"/>
      <rect x="398" y="572" width="228" height="216" fill="#22C55E"/>
      <rect x="626" y="572" width="242" height="216" fill="#EAB308"/>

      <!-- Missing-ish internal region -->
