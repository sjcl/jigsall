               C835 414 868 449 868 496
               C868 543 835 578 788 578
               V572 H626 Z"
            fill="#0F172A" opacity="0.38"/>

      <!-- Diagonal seam: upper-right bump restored, others remain inverted -->
      <g fill="none" stroke="#F8FAFC" stroke-opacity="0.72" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
        <path d="
          M650 180
          V286
          C698 286 726 315 726 356
          C726 397 698 426 650 426
          V468
          H548
          C548 516 519 544 478 544
          C437 544 408 516 408 468
          H356
          V566
          C308 566 280 595 280 636
          C280 677 308 706 356 706
          V788"/>
      </g>
    </g>

    <!-- Outer contour -->
    <path d="
      M 304 236
      H 424
      C 424 183 461 148 512 148
      C 563 148 600 183 600 236
      H 720
      C 758 236 788 266 788 304
      V 414
      C 835 414 868 449 868 496
