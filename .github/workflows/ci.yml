name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"
  # Bevy's debug information is large; retain debug assertions without symbols.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read minimum Rust version from Cargo.toml
        id: rust-version
        shell: python
        run: |
          import os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))["workspace"]["package"]["rust-version"]
          if not re.fullmatch(r"[0-9]+(?:\.[0-9]+){0,2}", version):
              raise ValueError(f"Invalid rust-version: {version!r}")
          version += ".0" * (2 - version.count("."))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"toolchain={version}\n")
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: ${{ steps.rust-version.outputs.toolchain }}
          components: rustfmt
      - run: cargo fmt --all --check
      - name: Release configuration and packaging regressions
        run: python3 .github/scripts/test_release.py
      - name: Build cache regressions
        run: python3 .github/scripts/test_build_cache.py

  test:
    name: Build, lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Allow cold Windows/GNS builds to finish and save the dependency cache.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      # A single-config generator keeps GNS in build/src when Cargo opt-level
      # changes, rather than a Debug/Release directory inferred differently by GNS.
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read minimum Rust version from Cargo.toml
        id: rust-version
        shell: python
        run: |
          import os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))["workspace"]["package"]["rust-version"]
          if not re.fullmatch(r"[0-9]+(?:\.[0-9]+){0,2}", version):
              raise ValueError(f"Invalid rust-version: {version!r}")
          version += ".0" * (2 - version.count("."))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"toolchain={version}\n")
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: ${{ steps.rust-version.outputs.toolchain }}
          components: ${{ runner.os == 'Linux' && 'clippy,rustfmt' || 'rustfmt' }}

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake ninja-build pkg-config libclang-18-dev \
            libssl-dev libprotobuf-dev protobuf-compiler \
            libudev-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev
          echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> "$GITHUB_ENV"

      - name: Install Windows LLVM 18.1.8
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'LLVM-18.1.8-win64.exe'
          $llvmDir = Join-Path $env:RUNNER_TEMP 'llvm-18.1.8'
          Invoke-WebRequest 'https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/LLVM-18.1.8-win64.exe' -OutFile $installer
          # SHA256 from microsoft/winget-pkgs' LLVM.LLVM 18.1.8 x64 manifest.
          $expectedHash = '94AF030060D88CC17E9F00EF1663EBDC1126B35E16BEBDFA1E807984B70ABD8F'
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'LLVM installer checksum mismatch'
          }
          $process = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$llvmDir" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "LLVM installation failed: $($process.ExitCode)" }
          $libclang = Join-Path $llvmDir 'bin'
          if (-not (Test-Path -LiteralPath (Join-Path $libclang 'libclang.dll'))) {
            throw 'LLVM installation did not provide libclang.dll'
          }
          "LIBCLANG_PATH=$libclang" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # rust-cache removes port manifests under target but leaves empty directories.
          # Use a short path outside target for versioned ports and native build work.
          $buildtrees = Join-Path $env:RUNNER_TEMP 'vcpkg-trees'
          "GNS_VCPKG_BUILDTREES_ROOT=$buildtrees" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Cache complete binary packages separately from Cargo's target cleanup.
          $binaryCache = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          New-Item -ItemType Directory -Path $binaryCache -Force | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$binaryCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare native cache identity and source timestamps
        id: native-cache
        env:
          # Hash before any restore can add manifests under target/.
          CARGO_CACHE_INPUTS: ${{ hashFiles('Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml', '**/rust-toolchain*') }}
        run: python .github/scripts/build_cache.py prepare --profile dev

      - name: Restore Windows vcpkg binary cache (shared with release)
        if: runner.os == 'Windows'
        id: vcpkg-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-cache.outputs.triplet }}-${{ steps.native-cache.outputs.vcpkg-environment }}-${{ hashFiles('vendor/game-networking-sockets-sys/thirdparty/GameNetworkingSockets/vcpkg.json') }}

      - name: Restore Cargo cache
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Include dependency definitions explicitly: disabling the automatic
          # environment hash also disables rust-cache's manifest/lockfile hash.
          add-rust-environment-hash-key: false
          key: ci-dev-v1-${{ matrix.os }}-${{ runner.arch }}-rust${{ steps.rust-version.outputs.toolchain }}-llvm18-${{ steps.native-cache.outputs.native-environment }}-${{ steps.native-cache.outputs.cargo-inputs }}

      # Restore AFTER rust-cache and save BEFORE its post-job target cleanup.
      # No prefix fallback: native outputs require this exact source/environment.
      - name: Restore GNS native cache (dev)
        id: gns-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/gns-native-cache/dev.tar
          key: gns-v1-${{ matrix.os }}-${{ runner.arch }}-dev-rust${{ steps.rust-version.outputs.toolchain }}-llvm18-${{ steps.native-cache.outputs.gns-tree }}-${{ steps.native-cache.outputs.native-environment }}-${{ steps.native-cache.outputs.cargo-inputs }}-${{ hashFiles('.github/scripts/build_cache.py') }}

      - name: Unpack GNS native cache (dev)
        if: steps.gns-cache.outputs.cache-hit == 'true'
        env:
          GNS_CACHE_ARCHIVE: ${{ runner.temp }}/gns-native-cache/dev.tar
        run: python .github/scripts/build_cache.py unpack

      - name: Report cache restores
        env:
          RUST_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          VCPKG_CACHE_HIT: ${{ steps.vcpkg-cache.outputs.cache-hit }}
          GNS_CACHE_HIT: ${{ steps.gns-cache.outputs.cache-hit }}
        run: python .github/scripts/build_cache.py summary

      # Keep default-feature type/lint coverage without a second runtime build.
      # Both platforms build their application and tests in one feature graph.
      - name: Clippy (default features)
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Clippy (all features)
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings
      # The runner also compiles examples and the excluded wrapper's initializer.
      # It runs ordinary tests and serial localhost tests from the same artifacts.
      - name: Linux build and runtime tests (all features)
        if: runner.os == 'Linux'
        run: python3 .github/scripts/ci.py --all-features
      # Rustdoc compiles code examples separately; retain doctest coverage while
      # reusing the all-feature library artifacts instead of rerunning unit tests.
      - name: Doctests (all features)
        if: runner.os == 'Linux'
        run: cargo test --workspace --locked --all-features --doc

      # Keep filesystem, logging, rendezvous/UI and native GNS runtime coverage.
      # Build the application and test executables in one Cargo invocation, then
      # run those executables directly without changing the package/feature graph.
      # Examples and doctests remain covered by Linux.
      - name: Windows build and runtime tests (rendezvous / GNS)
        if: runner.os == 'Windows'
        run: python .github/scripts/ci.py

      - name: Snapshot GNS native cache contents
        if: steps.gns-cache.outputs.cache-hit != 'true'
        env:
          GNS_CACHE_ARCHIVE: ${{ runner.temp }}/gns-native-cache/dev.tar
        run: python .github/scripts/build_cache.py pack --profile dev
      - name: Save GNS native cache before Cargo cleanup (dev)
        if: steps.gns-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/gns-native-cache/dev.tar
          key: ${{ steps.gns-cache.outputs.cache-primary-key }}

      - name: Install pinned license generator
        run: python .github/scripts/install_cargo_about.py
      - name: Smoke-test license collection and release packaging
        shell: python
        run: |
          import platform, subprocess
          windows = platform.system() == "Windows"
          target = "x86_64-pc-windows-msvc" if windows else "x86_64-unknown-linux-gnu"
          archive = "jigsall-windows-x86_64.zip" if windows else "jigsall-linux-x86_64.tar.gz"
          subprocess.run(["python", ".github/scripts/release.py", "licenses", "--target", target], check=True)
          subprocess.run(["python", ".github/scripts/release.py", "package", archive], check=True)
