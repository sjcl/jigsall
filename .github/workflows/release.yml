name: Draft release

on:
  push:
    tags: ['**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  verify-tag:
    name: Verify tag belongs to master
    if: github.event.deleted == false
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      on-master: ${{ steps.master.outputs.on-master }}
      commit: ${{ steps.master.outputs.commit }}
      toolchain: ${{ steps.rust-version.outputs.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Tags have no branch; a branches filter cannot restrict a tag push.
      # HEAD is the peeled commit for both lightweight and annotated tags.
      - name: Check master ancestry
        id: master
        shell: bash
        run: |
          commit=$(git rev-parse HEAD)
          if git merge-base --is-ancestor "$commit" refs/remotes/origin/master; then
            echo "on-master=true" >> "$GITHUB_OUTPUT"
            echo "commit=$commit" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
            echo "on-master=false" >> "$GITHUB_OUTPUT"
            echo "Tag commit is not in master; skipping the release." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Read minimum Rust version from Cargo.toml
        if: steps.master.outputs.on-master == 'true'
        id: rust-version
        shell: python
        run: |
          import os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))["workspace"]["package"]["rust-version"]
          if not re.fullmatch(r"[0-9]+(?:\.[0-9]+){0,2}", version):
              raise ValueError(f"Invalid rust-version: {version!r}")
          version += ".0" * (2 - version.count("."))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"toolchain={version}\n")
      - name: Verify release tag and workspace versions
        if: steps.master.outputs.on-master == 'true'
        shell: python
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          import os, subprocess
          subprocess.run(["python", ".github/scripts/release.py", "verify-version", os.environ["RELEASE_TAG"]], check=True)

  build:
    name: Release build (${{ matrix.platform }})
    needs: verify-tag
    if: needs.verify-tag.outputs.on-master == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            binary: jigsall
            archive: jigsall-linux-x86_64.tar.gz
          - os: windows-2022
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            binary: jigsall.exe
            archive: jigsall-windows-x86_64.zip
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: ${{ needs.verify-tag.outputs.toolchain }}
          components: rustfmt

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake ninja-build pkg-config libclang-18-dev \
            libssl-dev libprotobuf-dev protobuf-compiler \
            libudev-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev
          echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> "$GITHUB_ENV"

      - name: Install Windows LLVM 18.1.8
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'LLVM-18.1.8-win64.exe'
          $llvmDir = Join-Path $env:RUNNER_TEMP 'llvm-18.1.8'
          Invoke-WebRequest 'https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/LLVM-18.1.8-win64.exe' -OutFile $installer
          # SHA256 from microsoft/winget-pkgs' LLVM.LLVM 18.1.8 x64 manifest.
          $expectedHash = '94AF030060D88CC17E9F00EF1663EBDC1126B35E16BEBDFA1E807984B70ABD8F'
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'LLVM installer checksum mismatch'
          }
          $process = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$llvmDir" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "LLVM installation failed: $($process.ExitCode)" }
          $libclang = Join-Path $llvmDir 'bin'
          if (-not (Test-Path -LiteralPath (Join-Path $libclang 'libclang.dll'))) {
            throw 'LLVM installation did not provide libclang.dll'
          }
          "LIBCLANG_PATH=$libclang" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # rust-cache removes port manifests under target but leaves empty directories.
          # Use a short path outside target for versioned ports and native build work.
          $buildtrees = Join-Path $env:RUNNER_TEMP 'vcpkg-trees'
          "GNS_VCPKG_BUILDTREES_ROOT=$buildtrees" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Cache complete binary packages separately from Cargo's target cleanup.
          $binaryCache = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          New-Item -ItemType Directory -Path $binaryCache -Force | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$binaryCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare native cache identity and source timestamps
        id: native-cache
        env:
          # Hash before any restore can add manifests under target/.
          CARGO_CACHE_INPUTS: ${{ hashFiles('Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml', '**/rust-toolchain*') }}
        run: python .github/scripts/build_cache.py prepare --profile release

      - name: Restore Windows vcpkg binary cache (shared with CI)
        if: runner.os == 'Windows'
        id: vcpkg-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-cache.outputs.triplet }}-${{ steps.native-cache.outputs.vcpkg-environment }}-${{ hashFiles('vendor/game-networking-sockets-sys/thirdparty/GameNetworkingSockets/vcpkg.json') }}

      - name: Restore Cargo cache
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Keep release artifacts separate from CI's dev/test profile.
          add-rust-environment-hash-key: false
          key: release-v1-${{ matrix.os }}-${{ runner.arch }}-rust${{ needs.verify-tag.outputs.toolchain }}-llvm18-${{ steps.native-cache.outputs.native-environment }}-${{ steps.native-cache.outputs.cargo-inputs }}

      # Save in a normal step, before rust-cache removes excluded path crates
      # during its post-job cleanup. Cache only the sys crate, not all of target.
      - name: Restore GNS native cache (release)
        id: gns-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/gns-native-cache/release.tar
          key: gns-v1-${{ matrix.os }}-${{ runner.arch }}-release-rust${{ needs.verify-tag.outputs.toolchain }}-llvm18-${{ steps.native-cache.outputs.gns-tree }}-${{ steps.native-cache.outputs.native-environment }}-${{ steps.native-cache.outputs.cargo-inputs }}-${{ hashFiles('.github/scripts/build_cache.py') }}

      - name: Unpack GNS native cache (release)
        if: steps.gns-cache.outputs.cache-hit == 'true'
        env:
          GNS_CACHE_ARCHIVE: ${{ runner.temp }}/gns-native-cache/release.tar
        run: python .github/scripts/build_cache.py unpack

      - name: Report cache restores
        env:
          RUST_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          VCPKG_CACHE_HIT: ${{ steps.vcpkg-cache.outputs.cache-hit }}
          GNS_CACHE_HIT: ${{ steps.gns-cache.outputs.cache-hit }}
        run: python .github/scripts/build_cache.py summary

      # Public repository Variables only. TURN credentials are issued by the
      # server at runtime; provider secrets must never enter this build job.
      - name: Configure public Room Code defaults
        env:
          JIGSALL_RENDEZVOUS_WSS_URL: ${{ vars.JIGSALL_RENDEZVOUS_WSS_URL }}
          JIGSALL_ICE_STUN_SERVERS: ${{ vars.JIGSALL_ICE_STUN_SERVERS }}
          JIGSALL_ICE_ALLOW_PUBLIC_CANDIDATES: ${{ vars.JIGSALL_ICE_ALLOW_PUBLIC_CANDIDATES || 'true' }}
        run: python .github/scripts/release.py configure-defaults

      - name: Build application with Direct IP and Room Code support
        run: python .github/scripts/release.py build

      - name: Snapshot GNS native cache contents
        if: steps.gns-cache.outputs.cache-hit != 'true'
        env:
          GNS_CACHE_ARCHIVE: ${{ runner.temp }}/gns-native-cache/release.tar
        run: python .github/scripts/build_cache.py pack --profile release
      - name: Save GNS native cache before Cargo cleanup (release)
        if: steps.gns-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/gns-native-cache/release.tar
          key: ${{ steps.gns-cache.outputs.cache-primary-key }}

      - name: Install pinned license generator
        run: python .github/scripts/install_cargo_about.py

      - name: Generate Rust, native and font license notices
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        shell: python
        run: |
          import os, subprocess
          subprocess.run(["python", ".github/scripts/release.py", "licenses", "--target", os.environ["RELEASE_TARGET"]], check=True)

      - name: Package release
        shell: python
        env:
          BINARY_NAME: ${{ matrix.binary }}
          ARCHIVE_NAME: ${{ matrix.archive }}
        run: |
          import os, subprocess
          subprocess.run(["python", ".github/scripts/release.py", "package", os.environ["ARCHIVE_NAME"]], check=True)

      - name: Upload packaged build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jigsall-release-${{ matrix.platform }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  release:
    name: Create draft release
    needs: [verify-tag, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: jigsall-release-*
          path: dist
          merge-multiple: true
      # No checkout: only this job receives release write permission.
      - name: Create or update draft and attach builds
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ needs.verify-tag.outputs.commit }}
        run: |
          import hashlib, json, os, subprocess
          from pathlib import Path
          assets = sorted(Path("dist").iterdir())
          expected = {"jigsall-linux-x86_64.tar.gz", "jigsall-windows-x86_64.zip"}
          if {asset.name for asset in assets} != expected or not all(asset.is_file() for asset in assets):
              raise RuntimeError("Expected both Windows and Linux release archives")
          checksums = Path("dist/SHA256SUMS")
          with checksums.open("w", encoding="utf-8") as output:
              for asset in assets:
                  with asset.open("rb") as source:
                      digest = hashlib.file_digest(source, "sha256").hexdigest()
                  output.write(f"{digest}  {asset.name}\n")
          assets.append(checksums)
          tag = os.environ["RELEASE_TAG"]
          existing = subprocess.run([
              "gh", "release", "view", "--json", "isDraft", "--", tag
          ], capture_output=True, text=True)
          if existing.returncode == 0:
              if not json.loads(existing.stdout)["isDraft"]:
                  raise RuntimeError("Refusing to modify an already published release")
              if "-" in tag:
                  subprocess.run(["gh", "release", "edit", "--prerelease", "--", tag], check=True)
              subprocess.run([
                  "gh", "release", "upload", "--clobber", "--", tag,
                  *map(str, assets)
              ], check=True)
          else:
              subprocess.run([
                  "gh", "release", "create", "--draft", "--verify-tag",
                  "--title", tag, "--target", os.environ["RELEASE_COMMIT"],
                  *(["--prerelease"] if "-" in tag else []),
                  "--generate-notes", "--", tag, *map(str, assets)
              ], check=True)
