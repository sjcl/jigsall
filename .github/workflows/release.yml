name: Draft release

on:
  push:
    tags: ['**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  verify-tag:
    name: Verify tag belongs to master
    if: github.event.deleted == false
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      on-master: ${{ steps.master.outputs.on-master }}
      commit: ${{ steps.master.outputs.commit }}
      toolchain: ${{ steps.rust-version.outputs.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Tags have no branch; a branches filter cannot restrict a tag push.
      # HEAD is the peeled commit for both lightweight and annotated tags.
      - name: Check master ancestry
        id: master
        shell: bash
        run: |
          commit=$(git rev-parse HEAD)
          if git merge-base --is-ancestor "$commit" refs/remotes/origin/master; then
            echo "on-master=true" >> "$GITHUB_OUTPUT"
            echo "commit=$commit" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
            echo "on-master=false" >> "$GITHUB_OUTPUT"
            echo "Tag commit is not in master; skipping the release." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Read minimum Rust version from Cargo.toml
        if: steps.master.outputs.on-master == 'true'
        id: rust-version
        shell: python
        run: |
          import os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))["workspace"]["package"]["rust-version"]
          if not re.fullmatch(r"[0-9]+(?:\.[0-9]+){0,2}", version):
              raise ValueError(f"Invalid rust-version: {version!r}")
          version += ".0" * (2 - version.count("."))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"toolchain={version}\n")

  build:
    name: Release build (${{ matrix.platform }})
    needs: verify-tag
    if: needs.verify-tag.outputs.on-master == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            binary: jigsall
            archive: jigsall-linux-x86_64.tar.gz
          - os: windows-2022
            platform: windows-x86_64
            binary: jigsall.exe
            archive: jigsall-windows-x86_64.zip
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: ${{ needs.verify-tag.outputs.toolchain }}
          components: rustfmt

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake ninja-build pkg-config libclang-18-dev \
            libssl-dev libprotobuf-dev protobuf-compiler \
            libudev-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev
          echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> "$GITHUB_ENV"

      - name: Install Windows LLVM 18.1.8
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'LLVM-18.1.8-win64.exe'
          $llvmDir = Join-Path $env:RUNNER_TEMP 'llvm-18.1.8'
          Invoke-WebRequest 'https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/LLVM-18.1.8-win64.exe' -OutFile $installer
          # SHA256 from microsoft/winget-pkgs' LLVM.LLVM 18.1.8 x64 manifest.
          $expectedHash = '94AF030060D88CC17E9F00EF1663EBDC1126B35E16BEBDFA1E807984B70ABD8F'
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'LLVM installer checksum mismatch'
          }
          $process = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$llvmDir" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "LLVM installation failed: $($process.ExitCode)" }
          $libclang = Join-Path $llvmDir 'bin'
          if (-not (Test-Path -LiteralPath (Join-Path $libclang 'libclang.dll'))) {
            throw 'LLVM installation did not provide libclang.dll'
          }
          "LIBCLANG_PATH=$libclang" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # rust-cache removes port manifests under target but leaves empty directories.
          # Use a short path outside target for versioned ports and native build work.
          $buildtrees = Join-Path $env:RUNNER_TEMP 'vcpkg-trees'
          "GNS_VCPKG_BUILDTREES_ROOT=$buildtrees" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Cache complete binary packages separately from Cargo's target cleanup.
          $binaryCache = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          New-Item -ItemType Directory -Path $binaryCache -Force | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$binaryCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.os }}-llvm18
          env-vars: "CARGO CC CFLAGS CXX CMAKE RUST LIBCLANG GNS_VCPKG"
          cache-directories: ${{ runner.os == 'Windows' && format('{0}/vcpkg-binary-cache', runner.temp) || '' }}

      - name: Build application with multiplayer support
        run: cargo build --locked --release -p jigsall --bin jigsall --features gns

      - name: Package release
        shell: python
        env:
          BINARY_NAME: ${{ matrix.binary }}
          ARCHIVE_NAME: ${{ matrix.archive }}
        run: |
          import json, os, subprocess, tarfile, zipfile
          from pathlib import Path
          metadata = json.loads(subprocess.check_output([
              "cargo", "metadata", "--locked", "--no-deps", "--format-version", "1"
          ], text=True))
          binary = Path(metadata["target_directory"]) / "release" / os.environ["BINARY_NAME"]
          files = [
              (binary, f"jigsall/{binary.name}"),
              (Path("README.md"), "jigsall/README.md"),
              (Path("ui/fonts/OFL.txt"), "jigsall/licenses/MPLUS1p/OFL.txt"),
              (Path("ui/fonts/README.md"), "jigsall/licenses/MPLUS1p/README.md"),
          ]
          for source, _ in files:
              if not source.is_file():
                  raise FileNotFoundError(source)
          Path("dist").mkdir(exist_ok=True)
          archive = Path("dist") / os.environ["ARCHIVE_NAME"]
          if archive.name.endswith(".zip"):
              with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as output:
                  for source, name in files:
                      output.write(source, name)
          else:
              with tarfile.open(archive, "w:gz") as output:
                  for source, name in files:
                      output.add(source, arcname=name)

      - name: Upload packaged build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jigsall-release-${{ matrix.platform }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  release:
    name: Create draft release
    needs: [verify-tag, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: jigsall-release-*
          path: dist
          merge-multiple: true
      # No checkout: only this job receives release write permission.
      - name: Create or update draft and attach builds
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ needs.verify-tag.outputs.commit }}
        run: |
          import hashlib, json, os, subprocess
          from pathlib import Path
          assets = sorted(Path("dist").iterdir())
          expected = {"jigsall-linux-x86_64.tar.gz", "jigsall-windows-x86_64.zip"}
          if {asset.name for asset in assets} != expected or not all(asset.is_file() for asset in assets):
              raise RuntimeError("Expected both Windows and Linux release archives")
          checksums = Path("dist/SHA256SUMS")
          with checksums.open("w", encoding="utf-8") as output:
              for asset in assets:
                  with asset.open("rb") as source:
                      digest = hashlib.file_digest(source, "sha256").hexdigest()
                  output.write(f"{digest}  {asset.name}\n")
          assets.append(checksums)
          tag = os.environ["RELEASE_TAG"]
          existing = subprocess.run([
              "gh", "release", "view", "--json", "isDraft", "--", tag
          ], capture_output=True, text=True)
          if existing.returncode == 0:
              if not json.loads(existing.stdout)["isDraft"]:
                  raise RuntimeError("Refusing to modify an already published release")
              subprocess.run([
                  "gh", "release", "upload", "--clobber", "--", tag,
                  *map(str, assets)
              ], check=True)
          else:
              subprocess.run([
                  "gh", "release", "create", "--draft", "--verify-tag",
                  "--title", tag, "--target", os.environ["RELEASE_COMMIT"],
                  "--generate-notes", "--", tag, *map(str, assets)
              ], check=True)
